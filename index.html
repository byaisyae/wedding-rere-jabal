    <style>
      .rv,
      .rl,
      .rr,
      .rz {
        opacity: 0;
        transition:
          opacity 0.9s ease,
          transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
        transition-delay: var(--d, 0s);
      }
      .rv {
        transform: translateY(34px);
      }
      .rl {
        transform: translateX(-50px);
      }
      .rr {
        transform: translateX(50px);
      }
      .rz {
        transform: scale(0.88);
      }
      .in {
        opacity: 1 !important;
        transform: none !important;
      }
      body.lock {
        overflow: hidden;
      }
      #cover {
        transition: transform 1s cubic-bezier(0.7, 0, 0.3, 1);
      }
      #cover.up {
        transform: translateY(-100%);
      }
      .bg {
        background-size: cover;
        background-position: center;
      }
      #app {
        overflow-x: hidden;
      }
      @media (min-width: 1024px) {
        :root {
          --w: clamp(420px, 34vw, 520px);
        }
        #app {
          width: var(--w);
          margin-left: auto;
          position: relative;
          z-index: 10;
          background: #06122a;
          box-shadow: -24px 0 70px rgba(0, 0, 0, 0.55);
        }
        #cover {
          left: auto !important;
          width: var(--w);
        }
        #nav {
          left: calc(100% - var(--w) / 2) !important;
        }
        body {
          background: #06122a;
        }
      }
      .sl {
        transition: opacity 1.2s ease;
      }
      .ph {
        background: linear-gradient(135deg, #12305c, #0b1f3d);
      }
      @keyframes zm {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.12);
        }
      }
      .kb {
        animation: zm 18s ease-in-out infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        .rv,
        .rl,
        .rr,
        .rz {
          opacity: 1;
          transform: none;
          transition: none;
        }
        .kb {
          animation: none;
        }
      }
      .wd {
        display: inline-block;
        transform: translateY(115%);
        transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
        transition-delay: calc(var(--i) * 0.14s + 0.1s);
      }
      .in .wd {
        transform: none;
      }
      .rc img {
        clip-path: inset(0 0 100% 0);
        transform: scale(1.35);
        transition:
          clip-path 1.3s cubic-bezier(0.7, 0, 0.2, 1),
          transform 1.8s cubic-bezier(0.2, 0.7, 0.2, 1);
        transition-delay: var(--d, 0s);
      }
      .rc.in img {
        clip-path: inset(0);
        transform: none;
      }
      .fx {
        background-size: auto 135%;
        background-repeat: no-repeat;
      }
      #pg {
        left: 0;
        right: 0;
        transform-origin: left;
      }
      @media (min-width: 1024px) {
        #pg {
          left: calc(100% - var(--w));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rc img {
          clip-path: none;
          transform: none;
        }
        .wd {
          transform: none;
        }
      }

          "rsvp",
          "RSVP &amp; Ucapan Doa",
          "Konfirmasi kehadiran dan sampaikan doa restu untuk kedua mempelai.",
          `<form id="f" class="rz text-left max-w-md mx-auto space-y-3">
 <input name="web" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden">
 <input name="n" required minlength="2" placeholder="Nama" class="w-full px-4 py-3 rounded-xl bg-n9/80 border border-sk-300/30 outline-none focus:border-sk-300">
 <div class="grid grid-cols-2 gap-3"><select name="k" class="px-4 py-3 rounded-xl bg-n9/80 border border-sk-300/30"><option>Hadir</option><option>Tidak hadir</option><option>Masih ragu</option></select>
 <select name="j" class="px-4 py-3 rounded-xl bg-n9/80 border border-sk-300/30 disabled:opacity-40 disabled:cursor-not-allowed"><option>1 orang</option><option>2 orang</option><option>3 orang</option><option>4 orang</option></select></div>
 <textarea name="m" required rows="3" placeholder="Ucapan &amp; doa restu" class="w-full px-4 py-3 rounded-xl bg-n9/80 border border-sk-300/30 outline-none focus:border-sk-300"></textarea>
 <button class="w-full py-3 rounded-xl bg-sk-300 text-n9 font-semibold hover:bg-white transition">Kirim</button></form>
 <div id="cnt" class="mt-10 flex justify-center gap-6 text-sm"></div><div id="wl" class="mt-6 max-w-xl mx-auto space-y-3 text-left"></div><nav id="pgn" aria-label="Halaman ucapan" class="mt-5 flex flex-wrap justify-center items-center gap-1.5 text-sm"></nav>`,
          bgs(C.bg.foot, "rgba(6,18,42,.9)"),
        ) +
        sec(
          "hadiah",
          "Wedding Gift",
          "Tanpa mengurangi rasa hormat, bagi tamu yang ingin mengirimkan hadiah kepada kedua mempelai dapat melalui:",
          `<div class="grid sm:grid-cols-2 lg:grid-cols-1 gap-6 max-w-3xl mx-auto">${C.gifts.map((g) => `<div class="rl rounded-3xl p-7 bg-gradient-to-br from-n7 to-n9 border border-sk-300/30"><p class="font-serif text-2xl text-white">${g.bank}</p><p class="text-2xl tracking-widest my-2">${g.no}</p><p class="text-sm mb-4">a.n. ${g.name}</p><button data-copy="${g.no}" class="cp px-5 py-2 rounded-full bg-sk-300 text-n9 text-sm font-medium">Salin</button></div>`).join("")}
 <div class="rr rounded-3xl p-7 border border-sk-300/30 bg-n9/60"><p class="font-serif text-xl text-white">Alamat Pengiriman Hadiah</p><p class="text-sm my-3 leading-relaxed"><b class="text-white">${C.giftAddress.name}</b><br>${C.giftAddress.addr}</p><button data-copy="${C.giftAddress.name}, ${C.giftAddress.addr}" class="cp px-5 py-2 rounded-full bg-sk-300 text-n9 text-sm font-medium">Salin</button></div></div>`,
          "",
          "bg-n8",
        ) +
        `<footer class="relative py-28 px-6 text-center bg fx" style="${bgs(C.bg.foot, "rgba(6,18,42,.78)")}"><div class="rz max-w-xl mx-auto"><p class="text-sm">Kami yang berbahagia,</p><h2 class="font-script text-6xl sm:text-7xl lg:text-6xl text-white my-4">${B.nick} &amp; ${G.nick}</h2><p class="text-sm leading-relaxed">Merupakan sebuah kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu. Terima kasih.</p></div></footer><div class="h-20"></div>`;

      /* cover, tamu, navigasi */
      history.scrollRestoration = "manual";
      scrollTo(0, 0);
      $("#cvbg").style.backgroundImage = `url(${C.bg.cover})`;
      $("#coverDate").textContent = fmt;
      $("#sideDate").textContent = fmt.toUpperCase();
      const sl = [...document.querySelectorAll(".sl")];
      sl.forEach(
        (el) => (el.style.backgroundImage = `url(${C.bg[el.dataset.k]})`),
      );
      const SK = {
        home: "cover",
        mempelai: "cover",
        acara: "date",
        galeri: "quote",
        cerita: "quote",
        rsvp: "foot",
        hadiah: "foot",
      };
      const so = new IntersectionObserver(
        (es) =>
          es.forEach((x) => {
            if (x.isIntersecting) {
              const k = SK[x.target.id];
              sl.forEach(
                (el) => (el.style.opacity = el.dataset.k === k ? 1 : 0),
              );
            }
          }),
        { rootMargin: "-50% 0px -50% 0px" },
      );
      Object.keys(SK).forEach((i) => so.observe(document.getElementById(i)));
      $("#guest").textContent =
        new URLSearchParams(location.search).get("to") || "Tamu Undangan";
      $("#nav").innerHTML = [
        ["home", "Home"],
        ["mempelai", "Mempelai"],
        ["acara", "Acara"],
        ["galeri", "Galeri"],
        ["cerita", "Cerita"],
        ["rsvp", "RSVP"],
        ["hadiah", "Hadiah"],
      ]
        .map(
          ([i, t]) =>
            `<a href="#${i}" class="inline-block px-3 py-1.5 rounded-full hover:bg-sk-300 hover:text-n9 transition">${t}</a>`,
        )
        .join("");
      const a = $("#bgm");
      a.src = C.music;
      const mus = (on) => {
        $("#mb").innerHTML = on
          ? '<span style="display:inline-block;animation:spin 6s linear infinite">♫</span>'
          : '<span class="opacity-60 line-through">♫</span>';
      };
      $("#mb").onclick = () =>
        a.paused ? a.play().then(() => mus(1)) : (a.pause(), mus(0));
      $("#openBtn").onclick = () => {
        const c = $("#cover");
        document.body.classList.remove("lock");
        c.classList.add("up");
        scrollTo({ top: 0, behavior: "instant" });
        $("#pg").classList.remove("hidden");
        onS();
        $("#mb").classList.remove("hidden");
        a.play()
          .then(() => mus(1))
          .catch(() => mus(0));
        $("#nav").classList.remove("hidden");
        setTimeout(() => c.remove(), 1000);
      };

      /* countdown */
      const tick = () => {
        const s = Math.max(0, ((d0 - Date.now()) / 1000) | 0),
          v = [
            ["Hari", s / 86400],
            ["Jam", (s % 86400) / 3600],
            ["Menit", (s % 3600) / 60],
            ["Detik", s % 60],
          ];
        $("#cd").innerHTML = v
          .map(
            ([l, n]) =>
              `<div class="w-[4.3rem] sm:w-24 lg:w-[4.3rem] py-3 sm:py-5 lg:py-3 rounded-2xl border border-sk-300/30 bg-n9/60 backdrop-blur-sm"><div class="font-serif text-2xl sm:text-4xl lg:text-2xl text-white">${String(n | 0).padStart(2, "0")}</div><div class="text-[9px] sm:text-[10px] tracking-widest text-sk-300">${l.toUpperCase()}</div></div>`,
          )
          .join("");
      };
      tick();
      setInterval(tick, 1000);

      /* RSVP + ucapan + balasan: disimpan ke Google Sheet (C.rsvp); bila C.rsvp kosong → localStorage browser */
      const PER = 5; // ucapan per halaman (pagination muncul jika lebih dari ini)
      let WL = [],
        RL = [],
        wpg = 1,
        RO = null; // WL = ucapan, RL = balasan, wpg = halaman aktif, RO = id ucapan yang form balasannya terbuka
      const W = () => WL;
      const uid = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const IN =
        "w-full px-3 py-2 rounded-xl bg-n9/80 border border-sk-300/30 outline-none focus:border-sk-300 text-base";
      const draw = () => {
        const w = W(),
          n = (k) => w.filter((x) => x.k === k).length;
        $("#cnt").innerHTML = ["Hadir", "Tidak hadir", "Masih ragu"]
          .map(
            (k) =>
              `<span><b class="text-white text-xl">${n(k)}</b> ${k}</span>`,
          )
          .join("");
        const list = w
            .map((x, i) => [x, i])
            .sort((a, b) => (b[0].t || 0) - (a[0].t || 0) || b[1] - a[1])
            .map((a) => a[0]),
          pages = Math.max(1, Math.ceil(list.length / PER));
        wpg = Math.min(Math.max(wpg, 1), pages);
        const rf = $("#rf"),
          keep =
            rf && RO && rf.dataset.id === RO
              ? { n: $("#rn").value, m: $("#rm").value }
              : null; // pertahankan ketikan saat daftar di-refresh
        $("#wl").innerHTML = list
          .slice((wpg - 1) * PER, wpg * PER)
          .map((x) => {
            const rs = RL.filter((r) => r.w === x.id);
            return `<div class="rounded-2xl bg-n9/80 border border-sk-300/20 p-4"><p class="font-semibold text-white">${esc(x.n)} <span class="text-[10px] ml-1 px-2 py-0.5 rounded-full bg-sk-300/20 text-sk-300">${esc(x.k)}${x.k !== "Tidak hadir" && x.j && x.j !== "-" ? " · " + esc(x.j) : ""}</span></p><p class="text-sm mt-1">${esc(x.m)}</p>
  <button type="button" data-act="reply" data-id="${esc(x.id)}" class="mt-2 -ml-1 px-1 py-1 text-xs text-sk-300 hover:text-white transition">↩ Balas${rs.length ? ` · ${rs.length} balasan` : ""}</button>
  ${rs.length ? `<div class="mt-2 space-y-2 border-l-2 border-sk-300/30 pl-3">${rs.map((r) => `<div><p class="text-xs font-semibold text-white">${esc(r.n)}</p><p class="text-xs mt-0.5 break-words">${esc(r.m)}</p></div>`).join("")}</div>` : ""}
  ${RO === x.id ? `<form id="rf" data-id="${esc(x.id)}" class="mt-3 space-y-2"><input name="web" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden"><input id="rn" name="n" required minlength="2" maxlength="100" placeholder="Nama" class="${IN}"><textarea id="rm" name="m" required rows="2" maxlength="300" placeholder="Tulis balasan..." class="${IN}"></textarea><div class="flex gap-2"><button class="px-4 py-2 rounded-full bg-sk-300 text-n9 text-sm font-semibold hover:bg-white transition">Kirim Balasan</button><button type="button" data-act="cancel" class="px-4 py-2 rounded-full border border-sk-300/40 text-sm hover:bg-sk-300/10 transition">Batal</button></div></form>` : ""}</div>`;
          })
          .join("");
        if (keep) {
          $("#rn").value = keep.n;
          $("#rm").value = keep.m;
        }
        // pagination
        const nv = $("#pgn");
        if (pages < 2) {
          nv.innerHTML = "";
          return;
        }
        const pb = (p, l, on, off) =>
          `<button type="button" data-pg="${p}" ${off ? "disabled" : ""} ${on ? 'aria-current="page"' : ""} class="min-w-[2.25rem] h-9 px-3 rounded-full border transition ${on ? "bg-sk-300 text-n9 border-sk-300 font-semibold" : off ? "border-sk-300/20 text-sk-300/40" : "border-sk-300/40 hover:bg-sk-300/10"}">${l}</button>`;
        let h = pb(wpg - 1, "‹", 0, wpg === 1),
          lp = 0;
        [
          ...new Set(
            [1, wpg - 1, wpg, wpg + 1, pages].filter(
              (p) => p >= 1 && p <= pages,
            ),
          ),
        ]
          .sort((a, b) => a - b)
          .forEach((p) => {
            if (p - lp > 1) h += '<span class="px-1 text-sk-300/60">…</span>';
            h += pb(p, p, p === wpg);
            lp = p;
          });
        nv.innerHTML = h + pb(wpg + 1, "›", 0, wpg === pages);
      };
      const loadWishes = async () => {
        if (!C.rsvp) {
          WL = JSON.parse(localStorage.getItem("wishes") || "[]");
          WL.forEach((x, i) => (x.id = x.id || "l" + i));
          RL = JSON.parse(localStorage.getItem("replies") || "[]");
          return draw();
        }
        try {
          const r = await fetch(C.rsvp, { cache: "no-store" }),
            d = await r.json();
          if (d.ok) {
            WL = d.wishes || [];
            RL = d.replies || [];
          }
        } catch (_) {}
        draw();
      };
      // kirim ke Apps Script. no-cors: kiriman terkirim (respons tidak dibaca), daftar lalu dimuat ulang dari Sheet
      const post = (d) =>
        fetch(C.rsvp, {
          method: "POST",
          mode: "no-cors",
          body: new URLSearchParams(d),
        });
      const busy = (b, txt) => {
        const t = b.textContent;
        b.disabled = true;
        b.textContent = txt;
        return () => {
          b.textContent = t;
          b.disabled = false;
        };
      };
      // jumlah tamu dinonaktifkan jika memilih "Tidak hadir"
      const fk = $("#f").elements.k,
        fj = $("#f").elements.j;
      const syncJ = () => {
        fj.disabled = fk.value === "Tidak hadir";
      };
      fk.addEventListener("change", syncJ);
      $("#f").addEventListener("reset", () => setTimeout(syncJ));
      syncJ();
      $("#f").onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target,
          d = Object.fromEntries(new FormData(f));
        d.id = uid();
        d.t = Date.now();
        if (d.k === "Tidak hadir") d.j = "-"; // field disabled tidak ikut terkirim
        localStorage.setItem("rname", d.n);
        if (!C.rsvp) {
          WL.push(d);
          localStorage.setItem("wishes", JSON.stringify(WL));
          f.reset();
          wpg = 1;
          return draw();
        }
        const b = f.querySelector("button"),
          t = b.textContent;
        b.disabled = true;
        b.textContent = "Mengirim...";
        try {
          await post(d);
          WL.push(d);
          f.reset();
          wpg = 1;
          draw();
          b.textContent = "Terkirim ✓ Terima kasih";
          setTimeout(loadWishes, 2500);
        } catch (_) {
          b.textContent = "Gagal mengirim, coba lagi";
        }
        setTimeout(() => {
          b.textContent = t;
          b.disabled = false;
        }, 2500);
      };
      // buka/tutup form balasan
      $("#wl").addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        if (b.dataset.act === "cancel") RO = null;
        else RO = RO === b.dataset.id ? null : b.dataset.id;
        draw();
        if (RO) {
          const n = $("#rn");
          n.value = localStorage.getItem("rname") || "";
          (n.value ? $("#rm") : n).focus();
        }
      });
      // kirim balasan
      $("#wl").addEventListener("submit", async (e) => {
        const f = e.target.closest("#rf");
        if (!f) return;
        e.preventDefault();
        const d = Object.fromEntries(new FormData(f));
        d.act = "reply";
        d.w = f.dataset.id;
        localStorage.setItem("rname", d.n);
        const r = { w: d.w, n: d.n.trim(), m: d.m.trim() };
        if (!C.rsvp) {
          RL.push(r);
          localStorage.setItem("replies", JSON.stringify(RL));
          RO = null;
          return draw();
        }
        const done = busy(f.querySelector("button:not([type])"), "Mengirim...");
        try {
          await post(d);
          RL.push(r);
          RO = null;
          draw();
          setTimeout(loadWishes, 2500);
        } catch (_) {
          done();
          alert("Gagal mengirim balasan, coba lagi.");
        }
      });
      // pindah halaman
      $("#pgn").addEventListener("click", (e) => {
        const b = e.target.closest("[data-pg]");
        if (!b || b.disabled) return;
        wpg = +b.dataset.pg;
        draw();
        $("#cnt").scrollIntoView({ behavior: "smooth", block: "center" });
      });
      loadWishes();

      /* salin + lightbox (geser / panah / dot) */
      const copyTxt = (t, ok) => {
        const fb = () => {
          const a = document.createElement("textarea");
          a.value = t;
          a.style.cssText = "position:fixed;left:-9999px";
          document.body.appendChild(a);
          a.select();
          let g = false;
          try {
            g = document.execCommand("copy");
          } catch (_) {}
          a.remove();
          g ? ok() : prompt("Salin manual:", t);
        };
        navigator.clipboard && window.isSecureContext
          ? navigator.clipboard.writeText(t).then(ok, fb)
          : fb();
      };
      let li = 0;
      const GL = () => [...document.querySelectorAll(".gl")];
      const lbShow = (i, d = 0, first) => {
        const a = GL(),
          im = $("#lbi");
        li = (i + a.length) % a.length;
        const set = () => {
          im.src = a[li].src;
          im.style.opacity = 1;
          im.style.transform = "none";
        };
        if (first) set();
        else {
          im.style.opacity = 0;
          im.style.transform = `translateX(${d * 60}px)`;
          setTimeout(set, 200);
        }
        $("#lbd").innerHTML = a
          .map(
            (_, k) =>
              `<button data-i="${k}" aria-label="Foto ${k + 1}" class="ld h-2 rounded-full transition-all ${k == li ? "w-6 bg-white" : "w-2 bg-white/40"}"></button>`,
          )
          .join("");
      };
      const lbOpen = (i) => {
          $("#lb").classList.replace("hidden", "grid");
          lbShow(i, 0, 1);
        },
        lbClose = () => $("#lb").classList.replace("grid", "hidden");
      document.addEventListener("click", (e) => {
        const b = e.target.closest(".cp");
        if (b)
          return copyTxt(b.dataset.copy, () => {
            b.textContent = "Tersalin ✓";
            setTimeout(() => (b.textContent = "Salin"), 1800);
          });
        const g = e.target.closest(".gl");
        if (g) return lbOpen(GL().indexOf(g));
        if (e.target.closest("#lbp")) return lbShow(li - 1, -1);
        if (e.target.closest("#lbn")) return lbShow(li + 1, 1);
        const d = e.target.closest(".ld");
        if (d) return lbShow(+d.dataset.i, +d.dataset.i > li ? 1 : -1);
        if (e.target.id === "lb" || e.target.closest("#lbx")) lbClose();
      });
      let sx = 0;
      $("#lb").addEventListener(
        "touchstart",
        (e) => (sx = e.touches[0].clientX),
        { passive: true },
      );
      $("#lb").addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - sx;
          if (Math.abs(dx) > 50)
            lbShow(li + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
        },
        { passive: true },
      );
      addEventListener("keydown", (e) => {
        if ($("#lb").classList.contains("hidden")) return;
        if (e.key === "ArrowRight") lbShow(li + 1, 1);
        if (e.key === "ArrowLeft") lbShow(li - 1, -1);
        if (e.key === "Escape") lbClose();
      });

      /* animasi scroll interaktif */
      document.querySelectorAll("h2.rv").forEach((h) => {
        h.innerHTML = h.textContent
          .trim()
          .split(/\s+/)
          .map(
            (w, i) =>
              `<span class="inline-block overflow-hidden align-bottom px-3 -mx-3 py-3 -my-3"><span class="wd" style="--i:${i}">${esc(w)}</span></span>`,
          )
          .join(" ");
      });
      const AN = ".rv,.rl,.rr,.rz,.rc",
        grp = new Map();
      document.querySelectorAll(AN).forEach((el) => {
        const p = el.parentElement,
          i = grp.get(p) || 0;
        grp.set(p, i + 1);
        if (!el.style.getPropertyValue("--d"))
          el.style.setProperty("--d", Math.min(i, 5) * 0.12 + "s");
      });
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((x) => {
            if (x.isIntersecting) {
              x.target.classList.add("in");
              io.unobserve(x.target);
            }
          }),
        { threshold: 0.12 },
      );
      document.querySelectorAll(AN).forEach((el) => io.observe(el));
      const pe = [...document.querySelectorAll("[data-p]")],
        fx = [...document.querySelectorAll(".fx")],
        hc = $("#home>div"),
        pg = $("#pg");
      let tk = 0;
      const onS = () => {
        tk = 0;
        const h = innerHeight,
          y = scrollY,
          m = document.documentElement.scrollHeight - h;
        pg.style.transform = `scaleX(${m > 0 ? y / m : 0})`;
        hc.style.opacity = Math.max(0, 1 - y / (h * 0.75));
        fx.forEach((el) => {
          const r = el.getBoundingClientRect();
          if (r.bottom < 0 || r.top > h) return;
          el.style.backgroundPositionY =
            (
              Math.min(1, Math.max(0, (h - r.top) / (h + r.height))) * 100
            ).toFixed(1) + "%";
        });
        pe.forEach((el) => {
          const r = el.parentElement.getBoundingClientRect();
          if (r.bottom < -200 || r.top > h + 200) return;
          el.style.translate = `0 ${((r.top + r.height / 2 - h / 2) * -el.dataset.p).toFixed(1)}px`;
        });
      };
      addEventListener(
        "scroll",
        () => {
          if (!tk) tk = requestAnimationFrame(onS);
        },
        { passive: true },
      );
      onS();
    </script>
  </body>
</html>
